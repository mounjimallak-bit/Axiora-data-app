# Continuous integration of Axiora-data-app.
# On every push to main and every pull request: data checks, tests of the checks,
# the case-study analysis, and a smoke test that runs every page of the Streamlit app.
# No API key is needed: the assistant page only shows its "no key" message.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Record installed versions
        run: python -m pip freeze

      - name: Data checks
        run: python validate_data.py

      - name: Tests of the data checks
        run: python test_validate_data.py

      - name: Case-study analysis
        run: python analyse_pauvrete.py --figures

      - name: Every page of the app runs without an exception
        run: python test_app_pages.py
